name: Deploy plain HTML to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Verify static files and data compatibility
        run: node scripts/check.cjs
      - name: Choose an artifact name for this build attempt
        id: artifact
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: printf 'name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Stage app files without compiling
        shell: bash
        run: |
          mkdir _site
          cp -- ./*.html ./*.css ./*.js ./*.webmanifest ./*.svg ./*.png ./.nojekyll _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # A deploy-only retry must reuse the successful build's original name.
          artifact_name: ${{ needs.build.outputs.artifact_name }}
