name: Deploy plain HTML to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Verify static files and data compatibility
        run: node scripts/check.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage app files without compiling
        shell: bash
        run: |
          mkdir _site
          cp -- ./*.html ./*.css ./*.js ./*.webmanifest ./*.svg ./*.png ./.nojekyll _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
