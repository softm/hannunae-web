<!doctype html>
<html lang="ko" data-hannun-site="hannunae">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="stylesheet" href="./common-account.css">

  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">

<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="서비스 안내">
      <a class="brand" href="./" aria-label="한눈애 홈">
        <span class="brand-mark" aria-hidden="true">애</span>
        <span class="brand-word">한눈애<span>마음이 닿는 시작</span></span>
      </a>
      <p class="nav-label">OUR LITTLE CONNECTION</p>
      <nav class="desktop-nav" aria-label="주 메뉴"></nav>
      <div class="sidebar-note">
        <span class="tiny-heart" aria-hidden="true">♡</span>
        <p>서로를 알아가는 일은<br>작은 질문에서 시작돼요.</p>
        <span>내 속도로, 한 걸음씩.</span>
      </div>
      <div class="sidebar-footer"><span class="privacy-dot"></span> 내 답변은 이 브라우저에 저장돼요</div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <a class="mobile-brand" href="./"><span class="brand-mark" aria-hidden="true">애</span>한눈애</a>
        <span class="topbar-path">한눈애 <span>/</span> <b id="route-label">오늘</b></span>
        <div class="hannun-account" aria-label="한눈 계정"><span class="hannun-account-note">로그인해도 기록은 이 기기에 보관돼요</span><span id="siteAccountSlot"></span><a class="hannun-account-link" data-account-fallback href="https://softm-hannun-account.softm.workers.dev/account" target="_blank" rel="noopener noreferrer">한눈 계정 웹사이트</a></div>
      </header>
      <div id="storage-notice" class="storage-notice" hidden></div>
      <main id="main-content" tabindex="-1"></main>
      <footer class="page-footer">한눈애 <span>·</span> 서로를 알아가는 작은 시작</footer>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="모바일 주 메뉴"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <h2 id="dialog-title"></h2>
    <p id="dialog-message"></p>
    <div class="dialog-actions">
      <button type="button" class="button secondary" id="dialog-cancel">취소</button>
      <button type="button" class="button primary" id="dialog-confirm">확인</button>
    </div>
  </dialog>
  <input id="backup-input" type="file" accept=".json,application/json" hidden>

  <script src="./core.js" defer></script>
  <script src="./native-bridge.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./common-account.js" defer></script>
  <script src="./pwa.js" defer></script>
